services:
  backend:
    build: .
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    env_file: .env
    volumes:
      - media_data:/app/media

  celery-worker:
    build: .
    restart: unless-stopped
    command: celery -A media_bot worker -l info -c 2 --max-tasks-per-child=10
    env_file: .env
    volumes:
      - media_data:/app/media

  celery-beat:
    build: .
    restart: unless-stopped
    command: celery -A media_bot beat -l info --schedule=/tmp/celerybeat-schedule
    env_file: .env

volumes:
  media_data:

networks:
  default:
    name: rdl-base_default
    external: true
