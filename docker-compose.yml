services:
  db:
    image: postgis/postgis:15-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-media_bot}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      - db
      - redis
    ports:
      - "${BACKEND_PORT:-80}:8000"
    env_file: .env
    volumes:
      - ./backend:/app
      - media_data:/app/media

  celery-worker:
    build: .
    restart: unless-stopped
    command: celery -A media_bot worker -l info -c 2 --max-tasks-per-child=10
    depends_on:
      - db
      - redis
    env_file: .env
    volumes:
      - ./backend:/app
      - media_data:/app/media

  celery-beat:
    build: .
    restart: unless-stopped
    command: celery -A media_bot beat -l info --schedule=/tmp/celerybeat-schedule
    depends_on:
      - redis
    env_file: .env
    volumes:
      - ./backend:/app

volumes:
  db_data:
  redis_data:
  media_data:
