services:
  backend:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8001:8000"
    env_file: .env
    volumes:
      - ./backend:/app
      - media_data:/app/media
    environment:
      DJANGO_DEBUG: "True"

  celery-worker:
    build: .
    command: celery -A media_bot worker -l debug -c 1 --max-tasks-per-child=5
    volumes:
      - ./backend:/app
      - media_data:/app/media
    env_file: .env

  celery-beat:
    build: .
    command: celery -A media_bot beat -l info --schedule=/tmp/celerybeat-schedule
    env_file: .env

volumes:
  media_data:

networks:
  default:
    name: rdl-base_default
    external: true
